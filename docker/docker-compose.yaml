services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-test}
      POSTGRES_USER: ${DB_USER:-test}
      POSTGRES_PASSWORD: ${DB_PASS:-test}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gym}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: